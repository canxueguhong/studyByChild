name: 打包拼音 APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Vite（dist）
        run: |
          npm run build
          # 确认 base: './' 在 vite.config.ts

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  build-apk:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-licenses: true

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova 项目 & 复制 dist → www
        run: |
          cordova create cordova-app com.example.pinyin "拼音小乐园"
          cd cordova-app
          rm -rf www/*
          cp -r ../../dist/* www/
          cordova platform add android --save

      - name: Cordova build Android（Debug）
        run: |
          cd cordova-app
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 拼音小乐园-APK
          path: cordova-app/platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
