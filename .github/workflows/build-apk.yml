name: 打包拼音 APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 任务一：构建前端 dist
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装前端依赖
        run: npm install

      - name: Vite 构建（生成 dist）
        # 如果 package.json 的 build 已经被改成 cordova，可用 npx vite build
        run: |
          npx vite build
          echo "✅ dist 构建完成"

      - name: 上传 dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # 任务二：Cordova 打包 APK（依赖上面成功的 dist）
  build-apk:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载已经构建好的 dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-licenses: true

      - name: 安装 Cordova
        run: npm install -g cordova

      - name: 创建 Cordova 壳并复制资源
        run: |
          cordova create cordova-app com.pinyin.learning "拼音小乐园"
          cd cordova-app
          rm -rf www/*
          cp -r ../../dist/* www/
          cordova platform add android --save

      - name: Cordova 编译 Debug APK
        run: |
          cd cordova-app
          cordova build android

      - name: 上传生成的 APK
        uses: actions/upload-artifact@v4
        with:
          name: 拼音小乐园-APK
          path: cordova-app/platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
